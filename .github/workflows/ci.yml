name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: payment_service
          MYSQL_ROOT_PASSWORD: REDACTED
        ports:
          - 3307:3306

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build fraud-detection image
        run: docker build -t fraud-detection ./fraud-detection

      - name: Start fraud-detection
        run: docker run -d --name fraud-detection -p 8000:8000 fraud-detection

      - name: Build payment-system-without-spring
        working-directory: payment-system-without-spring
        run: mvn clean install